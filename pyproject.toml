[project]
name = "geospatial-pipelines-fima-nifp"
version = "0.1.0"
description = "Efficient geospatial data processing pipelines for aggregating and analyzing FIMA NFIP claims and policies data at the county level."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.1",
    "geopandas>=1.1.3",
    "pandas>=3.0.2",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
]
